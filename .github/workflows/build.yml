name: Auto build and pre-release

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: windows
            platform_arch: x64
            os: windows-latest
            name: "Windows-x64"
          - platform: windows
            platform_arch: Win32
            os: windows-latest
            name: "Windows-x86"
          - platform: android
            os: ubuntu-latest
            name: "Android"
    
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up JDK 21
      if: matrix.platform == 'android'
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: temurin
        cache: gradle

    - name: Build Android
      if: matrix.platform == 'android'
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload Android (Test)
      if: matrix.platform == 'android'
      uses: actions/upload-artifact@v7
      with:
        name: native-libs
        path: .
        archive: true



    - name: Setup MSVC
      if: matrix.platform == 'windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.platform_arch == 'Win32' && 'x86' || 'x64' }}

    - name: Configure Windows
      if: matrix.platform == 'windows'
      working-directory: plugins
      run: cmake -B build-${{matrix.platform_arch}} -G Ninja 

    - name: Build Windows
      if: matrix.platform == 'windows'
      working-directory: plugins
      run: cmake --build build-${{matrix.platform_arch}} --parallel
    
    - name: Upload Windows (test)
      if: matrix.platform_arch == 'windows'
      uses: actions/upload-artifact@v7
      with:
        name: build-${{matrix.platform_arch}}
        path: .
        archive: true
        

    - name: Dump CMake error (if failed)
      if: failure()
      run: |
        find . -name "CMakeError.log" -exec cat {} \;
        find . -name "CMakeOutput.log" -exec cat {} \;

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./artifacts

    - name: Prepare release
      run: |
        mkdir -p release_assets
        COMMIT=${GITHUB_SHA::7}
        #VERSION=1.0.0
        # copy + rename .so
        find ./artifacts -name "*.apk" -exec cp {} release_assets/ \;
        find ./artifacts -name "*.dll" -exec cp {} release_assets/ \;

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: stable-${{ github.sha }}
        name: "🚧 Auto Build"
        body: "Auto build from main branch"
        files: release_assets/*
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}